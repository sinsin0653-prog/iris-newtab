name = "shukudai-worker"
main = "src/index.js"
compatibility_date = "2025-09-01"

# 5 分おきにはしごを見る
[triggers]
crons = ["*/5 * * * *"]

# `wrangler kv namespace create SHUKUDAI` で出た id に置き換える
[[kv_namespaces]]
binding = "SHUKUDAI"
id = "PUT_YOUR_KV_NAMESPACE_ID"

[vars]
# アプリを置いた場所（GitHub Pages なら https://<user>.github.io）。"*" でも動くが絞った方がいい
APP_ORIGIN = "*"

# 秘密は `wrangler secret put <NAME>` で入れる（ファイルに書かない）：
#   DISCORD_TOKEN       Bot のトークン
#   DISCORD_PUBLIC_KEY  Developer Portal の Public Key
#   DISCORD_APP_ID      Application ID（コマンド登録に使う）
#   SYNC_TOKEN          アプリの設定に貼る合言葉（長いランダム文字列）
