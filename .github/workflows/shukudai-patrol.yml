# 宿題忘れゼロ：5 分おきにサーバー（Cloudflare Worker）を起こして、催促を送らせる。
# Cloudflare の Cron トリガーの代わり（両方あっても、サーバー側で 4 分以内の重複は無視する）。
# GitHub の予定実行は数分遅れることがある。サーバーは 30 分までの遅れなら催促を送る。
name: shukudai 見回り
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: shukudai-patrol
  cancel-in-progress: false
jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: サーバーを起こす
        env:
          URL: https://shukudai-worker.3252327.workers.dev/api/tick
        run: |
          code=$(curl -sS -o body.txt -w '%{http_code}' --retry 3 --retry-delay 5 --max-time 30 -X POST "$URL") || exit 1
          cat body.txt; echo
          # 404 はサーバーのコードがまだ古い（/api/tick がない）だけ。失敗メールを 5 分おきに送らないよう、警告にとどめる
          if [ "$code" = "404" ]; then echo "::warning::サーバーのコードが古い。worker/dist/worker.js を Cloudflare に貼り直す"; exit 0; fi
          [ "$code" -lt 400 ]
